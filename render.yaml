# render.yaml —— EHS系统 Render 部署配置
# 使用方式: Render Dashboard -> New -> Blueprint -> 关联仓库 -> 选用此文件
# 或: Render Dashboard -> 现有服务 -> Settings -> Environment Variables

services:
  - type: web
    name: ehs-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard              # 至少 2GB RAM，RuoYi 内存占用大
    healthCheckPath: /health
    
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      
      # ↓↓↓ PostgreSQL 数据库（Render/Neon/AWS RDS）↓↓↓
      - key: DB_HOST
        value: <填入PostgreSQL主机地址，如 ep-xxx-xxx.aws.neon.tech>
      - key: DB_NAME
        value: ryvue
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        value: <填入数据库密码>
      - key: DB_PORT
        value: "5432"
      
      # ↓↓↓ Redis（Render/Upstash/AWS ElastiCache）↓↓↓
      - key: REDIS_HOST
        value: <填入Redis主机地址，如 redis.upstash.io>
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: <填入Redis密码>
      
      # ↓↓↓ JVM 内存（根据套餐调整）↓↓↓
      - key: JAVA_OPTS
        value: "-Xms512m -Xmx1500m -XX:+UseZGC"
