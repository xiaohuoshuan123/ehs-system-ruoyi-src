---
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfiguration

--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /ruoyi/server/temp

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: @monitor.username@
  password: @monitor.password@

--- # snail-job 配置
snail-job:
  enabled: false
  group: "ruoyi_group"
  token: "SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT"
  server:
    host: 127.0.0.1
    port: 17888
  namespace: ${spring.profiles.active}
  port: 2${server.port}
  host:

--- # snail-ai 配置
snail-ai:
  enabled: false
  server:
    host: 127.0.0.1
    port: 18888
  app-id: 1
  token: SAI_566a6bfbc26e4998b4841cc927d50c5d
  port: 3${server.port}
  skill-temp-dir: /tmp/snail-ai-agent/skills
  chat.ui.embed:
    enabled: true
    show-header: false
    show-sidebar-user: false
    show-agent-market: true
    compact-input: true
    lock-agent: false
  open-api:
    enabled: true
    web-port: 8900
    https: false
    prefix: snail-ai
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    chat-timeout-ms: 300000

--- # MyBatis Plus 配置
mybatis-plus:
  sql-log:
    enabled: false
    output: console

--- # 数据源配置 - PostgreSQL (Render 专用)
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ryvue}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${DB_USER:postgres}
          password: ${DB_PASSWORD:postgres}
        postgres:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ryvue}?useUnicode=true&characterEncoding=utf8&useSSL=false&reWriteBatchedInserts=true
          username: ${DB_USER:postgres}
          password: ${DB_PASSWORD:postgres}
      hikari:
        maxPoolSize: 10
        minIdle: 2
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 60000
        maxLifetime: 600000
        keepaliveTime: 30000

--- # redis 配置 - Render 环境禁用
spring.data:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    timeout: 5s
    ssl.enabled: false

redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: RuoYi-Vue-Plus
    connectionMinimumIdleSize: 4
    connectionPoolSize: 16
    idleConnectionTimeout: 10000
    timeout: 5000
    subscriptionConnectionPoolSize: 5

--- # mail 邮件发送 (禁用)
mail:
  enabled: false

--- # sms 短信 (禁用)
sms:
  enabled: false
  restricted: false
  blends: {}

--- # 三方授权 (禁用)
justauth:
  enabled: false
  address: http://localhost:80
